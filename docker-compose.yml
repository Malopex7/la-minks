version: '3.8'

services:
  # Backend Express API (Simulated Cloud / Production)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: laminks-backend-prod
    restart: unless-stopped
    env_file:
      - ./backend/.env
    ports:
      - "8081:5001"
    environment:
      - NODE_ENV=production
      - PORT=5001
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:8080}
    networks:
      - laminks-network

  # Frontend Next.js 15 Standalone (Simulated Cloud / Production)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8081/api}
        - NEXT_PUBLIC_PAYSTACK_KEY=${PAYSTACK_PUBLIC_KEY:-pk_test_2c295861bffdb0881573eaa45bfa882bd12b9f09}
        - NEXT_PUBLIC_FIREBASE_API_KEY=AIzaSyDWnjm6rzaX8tPLPh_mHB0TnIzkxXedS7c
        - NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=la-minks.firebaseapp.com
        - NEXT_PUBLIC_FIREBASE_PROJECT_ID=la-minks
        - NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=la-minks.firebasestorage.app
        - NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=245034365588
        - NEXT_PUBLIC_FIREBASE_APP_ID=1:245034365588:web:65afc6ac082afc0e59ba81
    container_name: laminks-frontend-prod
    restart: unless-stopped
    ports:
      - "8080:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    depends_on:
      - backend
    networks:
      - laminks-network

networks:
  laminks-network:
    driver: bridge

